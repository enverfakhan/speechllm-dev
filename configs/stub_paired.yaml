# stub_paired.yaml — stub-mode smoke check for paired-prompt batching.
# Data: run `python tools/make_stub_shard.py` once to generate data_stub/.
# Stage 1 is unpaired, stage 2 pairs: both shapes exercised in one run
# (mel batch dim n, sequence batch dim 2n through prepare_input and llama).
model:
  stub: true
  whisper_ckpt: null
  # In-layer adapters on: the audio mask is built from audio_lengths, so this is
  # what checks that the 2n sequence-row lengths (not the n audio rows) reach
  # Llama in paired mode.
  audio_adapter_r: 8
  audio_adapter_type: swiglu
data:
  shards: data_stub/stub-train-{000000..000001}.tar
  diag_shard: data_stub/stub-diag-000000.tar
  num_workers: 0
logging: {wandb: false, project: speech-llm-dev}
checkpoint: {dir: checkpoints/stub-paired, save_every: null}
run: {max_steps: 10, instruction_mode: both}
metrics:
  eval_every: 5
  eval_batches: 2
  eval_batch_size: 4
  wer: {enabled: false}
stages:
  - name: unpaired
    trainable: [adapter]
    lrs: {adapter: 1.0e-4}
    batch_size: 4
    accum_steps: 1
    exit: {strategy: max_steps, threshold: 4}

  - name: paired
    trainable: [adapter, audio_adapters]
    lrs: {adapter: 1.0e-4, audio_adapters: 1.0e-4}
    batch_size: 4               # SEQUENCES → 2 audios × 2 prompt variants
    accum_steps: 1
    paired_prompts: true
    exit: {strategy: max_steps}
