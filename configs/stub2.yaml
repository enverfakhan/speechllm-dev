# stub2.yaml — two-stage stub run for pipeline validation.
# Data: run `python tools/make_stub_shard.py` once to generate data_stub/.
model:
  stub: true
  whisper_ckpt: null
data:
  shards: data_stub/stub-train-{000000..000001}.tar
  diag_shard: data_stub/stub-diag-000000.tar
  num_workers: 0
logging: {wandb: false, project: speech-llm-dev}
checkpoint: {dir: checkpoints/stub2, save_every: null}
run: {max_steps: 10, instruction_mode: unformatted}
metrics:
  eval_every: 5
  eval_batches: 2
  eval_batch_size: 4
  wer: {enabled: false}
stages:
  - name: adapter_only
    trainable: [adapter]
    lrs: {adapter: 1.0e-4}
    batch_size: 4
    accum_steps: 2
    exit: {strategy: max_steps, threshold: 4}
  - name: full_finetune
    trainable: [encoder, adapter, llama]
    lrs: {encoder: 1.0e-5, adapter: 5.0e-5, llama: 1.0e-5}
    batch_size: 4
    accum_steps: 2
    optimizer_init: fresh
    exit: {strategy: max_steps}
