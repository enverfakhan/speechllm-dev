# stub_chat.yaml — 20-step stub TRAINING run under the chat convention.
# Data: run `python tools/make_stub_shard.py` once to generate data_stub/.
#
# The local stand-in for configs/instruct-chat-3stage.yaml: a tiny random Llama
# with the same input_convention / bridge / in-layer adapter shape, so the
# training loop's chat path — ChatTemplate assembly, audio_mask at the constant
# offset, <|eot_id|> as the EOS target — runs end to end on the RTX 3060.
# (Replaces the retired `--stub --max-steps 20` CLI flags, which never existed
# and were silently ignored.)
#
#   python training.py --config configs/stub_chat.yaml
model:
  stub: true
  whisper_ckpt: null
  input_convention:   chat
  bridge_type:        swiglu
  audio_adapter_r:    16
  audio_adapter_type: swiglu
data:
  tokenizer:   data/pruned_tokenizer_chat/
  shards: data_stub/stub-train-{000000..000001}.tar
  diag_shard:  data_stub/stub-diag-000000.tar
  num_workers: 0
logging: {wandb: false, project: speech-llm-dev}
checkpoint: {dir: checkpoints/stub-chat, save_every: null}
run: {max_steps: 20, instruction_mode: both}
metrics:
  eval_every: 5
  eval_batches: 2
  eval_batch_size: 4
  wer: {enabled: false}
stages:
  - name: bridge_only
    trainable: [adapter]
    lrs: {adapter: 1.0e-4}
    batch_size: 4
    accum_steps: 1
    exit: {strategy: max_steps, threshold: 10}
  - name: audio_adapters_only
    trainable: [audio_adapters]
    lrs: {audio_adapters: 1.0e-4}
    batch_size: 4
    accum_steps: 1
    exit: {strategy: max_steps}
