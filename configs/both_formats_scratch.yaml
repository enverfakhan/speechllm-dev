# both_formats_scratch.yaml
# Baseline adapter-only config, but trains BOTH instruction formats from
# scratch (fresh adapter, pretrained base) for 20k steps.
data:
  shards_file: data/full_training_shards.txt
  diag_shard:  data/full-eval-test-dev-clean-other.tar
  num_workers: 32
  eval:        # for tools/run_wer.py only — training ignores these. Adjust paths.
    dev_clean:  data/eval_subset/dev-clean-480.tar
    dev_other:  data/eval_subset/dev-other-480.tar
    test_clean: data/eval_subset/test-clean-480.tar
    test_other: data/eval_subset/test-other-480.tar
logging:
  wandb:    true
  project:  speechllm-auto-stage
  run_name: both-formats-scratch
checkpoint:
  dir:        checkpoints/both-formats-scratch
  save_every: 360
metrics:
  train_periods: {grads: 1, logits: 90, loss: 1}
  eval_every:      90
  eval_batches:    10
  eval_batch_size: 64
run:
  max_steps:        20000
  instruction_mode: both
stages:
  - name:        adapter_both
    trainable:   [adapter]
    lrs:         {adapter: 1.0e-4}
    batch_size:  64
    accum_steps: 2
    exit:        {strategy: never}   # run to the global max_steps