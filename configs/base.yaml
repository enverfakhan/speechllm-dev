# base.yaml — every parameter with its default value.
# Run configs override these sparsely. Each entry in a run config's `stages:`
# list is merged onto `stage_defaults` below.

seed: 42

data:
  shards_file: null            # text file of shard paths (one per line)
  shards: null                 # OR a brace/glob pattern; set exactly one
  tokenizer: data/pruned_tokenizer/
  diag_shard: null             # single .tar shard for in-loop eval
  eval: {dev_clean: null, dev_other: null, test_clean: null, test_other: null}
  num_workers: 4

model:
  stub: false
  stub_dims: {n_layers: 6, d_model: 512, n_heads: 8, n_kv_heads: 2, intermediate_size: 1024}
  whisper_ckpt: weights/whisper_small.pt
  llama_ckpt: weights/Llama3.1-8B/Llama3.1-8B/Llama3.1-8B/
  adapter_pca_init: null
  gradient_checkpointing: true   # recompute activations during backward to reduce peak VRAM
  encoder_gradient_checkpointing: true   # same, for the Whisper encoder blocks (no-op while the encoder is frozen)
  init_from: null                # path to checkpoint for weights-only warm-start
  bridge_type: mlp               # encoder→llama bridge: mlp (linear→gelu→linear) | swiglu
  audio_adapter_r: 0             # per-layer audio adapter width; 0 = disabled
  audio_adapter_type: mlp        # mlp (down→gelu→up) | swiglu (SwiGLU bottleneck)
  audio_adapter_zero_writer_layers: 0   # swiglu only: first N layers zero down_proj
                                        # instead of gate_proj (0 = none)

optim:
  betas: [0.9, 0.999]
  weight_decay: 0.01
  grad_clip: {enabled: true, max_norm: 1.0}

logging:
  wandb: false
  project: speech-llm-dev
  run_name: null

checkpoint:
  dir: checkpoints
  save_every: null

metrics:
  train_periods: {grads: 1, logits: 10, loss: 1}
  eval_every: 10
  eval_batches: 3
  eval_batch_size: 8
  compute_only_on_emit: {logits: false}
  wer:
    enabled: false
    period: 500
    max_batches: 5
    readiness_first_token_below: 3.0
    sample_transcriptions: 20

run:
  max_steps: null
  instruction_mode: unformatted

stage_defaults:
  name: stage
  trainable: [adapter]
  lrs: {adapter: 1.0e-4}
  schedule: {warmup_steps: 0}
  batch_size: 64
  accum_steps: 1
  instruction_mode: null       # null = inherit run.instruction_mode
  optimizer_init: fresh
  paired_prompts: false        # true = each audio contributes BOTH prompt variants
                               # as two sequences sharing one encoder+bridge pass;
                               # needs resolved instruction_mode "both" and an even
                               # batch_size (which still counts SEQUENCES)
  # strategy: first_token_below | eval_loss_below | max_steps | epochs | never
  #   first_token_below / eval_loss_below  threshold = loss value (required)
  #   max_steps                            threshold = stage-local step budget
  #   epochs                               threshold = completed epochs, int >= 1
  #                                        (checked at the epoch boundary)
  #   never                                threshold ignored
  exit: {strategy: max_steps, threshold: null, min_steps: 0}

stages: []                     # filled in by run configs
