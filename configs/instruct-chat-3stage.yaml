# instruct-chat-3stage.yaml — run E1: Llama 3.1 8B Instruct + chat template.
#
# Sequence (model/sequence.py):
#
#   [bos][start_header]"user"[end_header]"\n\n"
#       AUDIO_BOS [audio] AUDIO_EOS "\n" {instruction}
#   [eot]
#   [start_header]"assistant"[end_header]"\n\n"
#       {transcript}
#   [eot]                                   <- the EOS target
#
# - data.tokenizer must be the vocabulary built WITH the four chat specials
#   (tools/build_vocab.py); <|eot_id|> is the only terminator.
# - AUDIO_BOS / AUDIO_EOS are two learned vectors on the bridge (no logit row,
#   never generated).  They sit in the "adapter" param group, so they train in
#   stages 1 and 3 and ride in every adapter checkpoint.
# - No warm start: bridge, in-layer adapters and markers all start fresh.
# - Three stages: bridge → in-layer adapters → encoder + bridge + adapters.
#   Stage 3 runs batch_size 60 × accum_steps 2 (the chat scaffold lengthens
#   every sequence; re-probe after any layout change with
#       python tools/find_max_batch.py \
#           --config configs/instruct-chat-3stage.yaml --stage 3 ).
# - Step 15040 is the endpoint; training past it makes WER worse.
# - Each stage handoff (step*-stage-handoff.pt) is a WER measurement point:
#       python tools/run_wer.py --config configs/instruct-chat-3stage.yaml \
#           --checkpoints 'checkpoints/instruct-chat-3stage/*stage-handoff.pt' \
#           --output results/instruct_chat_3stage_wer.csv --full
#
# Launch with:
#   python training.py --config configs/instruct-chat-3stage.yaml

seed: 49                        # fresh line; decorrelate data order from 42-48
model:
  init_from:          null      # scratch — no warm start
  llama_ckpt:         /workspace/.llama/checkpoints/Llama3.1-8B-Instruct/
  audio_adapter_r:    128
data:
  # ⚠ must be the vocabulary rebuilt WITH the chat specials
  tokenizer:   data/pruned_tokenizer_chat/
  shards_file: data/full_training_shards.txt
  diag_shard:  data/full-eval-test-dev-clean-other.tar
  num_workers: 32
  eval:
    dev_clean:  data/eval_subset_shards/dev-clean-480.tar
    dev_other:  data/eval_subset_shards/dev-other-480.tar
    test_clean: data/eval_subset_shards/test-clean-480.tar
    test_other: data/eval_subset_shards/test-other-480.tar
logging:
  wandb:    true
  project:  speechllm-auto-stage
  run_name: instruct-chat-3stage
checkpoint:
  dir:        checkpoints/instruct-chat-3stage
  save_every: 360
metrics:
  train_periods: {grads: 1, logits: 90, loss: 1}
  eval_every:      90
  eval_batches:    10
  eval_batch_size: 64
run:
  max_steps:        15040        # 3 × 4680 + 1000
  instruction_mode: both
stages:
  - name:        bridge_only
    trainable:   [adapter]       # bridge + AUDIO_BOS/AUDIO_EOS markers
    lrs:         {adapter: 1.0e-4}
    batch_size:  64
    accum_steps: 2
    exit:        {strategy: max_steps, threshold: 4680}

  - name:        audio_adapters_only
    trainable:   [audio_adapters]
    lrs:         {audio_adapters: 1.0e-4}
    schedule:    {warmup_steps: 250}
    batch_size:  64
    accum_steps: 2
    exit:        {strategy: max_steps, threshold: 4680}

  - name:        full_stack
    trainable:   [encoder, adapter, audio_adapters]
    lrs:         {encoder: 1.0e-5, adapter: 5.0e-5, audio_adapters: 5.0e-5}
    schedule:    {warmup_steps: 1000}
    batch_size:  60
    accum_steps: 2
    exit:        {strategy: max_steps, threshold: 5680}
