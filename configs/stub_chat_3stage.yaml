# stub_chat_3stage.yaml — the E1 curriculum (configs/instruct-chat-3stage.yaml)
# in miniature: bridge_only → audio_adapters_only → full_stack, 18 steps.
# Data: run `python tools/make_stub_shard.py` once to generate data_stub/.
#
# The point is stage 3: it unfreezes the Whisper encoder alongside the bridge
# and the in-layer adapters, so the encoder's gradient-checkpointed backward,
# three param groups and the stage handoffs all run locally.  warmup_steps
# exercises the warmup scheduler.
#
#   python training.py --config configs/stub_chat_3stage.yaml
model:
  stub: true
  whisper_ckpt: null
  audio_adapter_r: 16
data:
  shards: data_stub/stub-train-{000000..000001}.tar
  diag_shard: data_stub/stub-diag-000000.tar
  num_workers: 0
logging: {wandb: false, project: speech-llm-dev}
checkpoint: {dir: checkpoints/stub-chat-3stage, save_every: 5}
run: {max_steps: 18, instruction_mode: both}
metrics:
  eval_every: 3
  eval_batches: 2
  eval_batch_size: 4
  wer: {enabled: false}
stages:
  - name: bridge_only
    trainable: [adapter]
    lrs: {adapter: 1.0e-4}
    batch_size: 4
    accum_steps: 1
    exit: {strategy: max_steps, threshold: 6}
  - name: audio_adapters_only
    trainable: [audio_adapters]
    lrs: {audio_adapters: 1.0e-4}
    schedule: {warmup_steps: 2}
    batch_size: 4
    accum_steps: 1
    exit: {strategy: max_steps, threshold: 6}
  - name: full_stack
    trainable: [encoder, adapter, audio_adapters]
    lrs: {encoder: 1.0e-5, adapter: 5.0e-5, audio_adapters: 5.0e-5}
    schedule: {warmup_steps: 2}
    batch_size: 2
    accum_steps: 2
    exit: {strategy: max_steps}
